server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard and the Super Admin panel must never be shown inside another site's frame (clickjacking): a store
    # page on a {sub}.ROOT_DOMAIN address is the same "site", so a framed dashboard would load signed in. Only our own
    # pages may frame it (printElement prints through a same-origin iframe). These apply to every location below that
    # has no add_header of its own (location / included).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Standard safety headers (security F-56). HSTS only matters over https (Caddy); browsers ignore it on plain http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    server_tokens off;

    # Compression (PERFORMANCE-PLAN.md Step 3): the bundle and JSON shrink ~70-80%. Caddy in front would also compress,
    # but it leaves an answer that already has a Content-Encoding alone, so this works with or without Caddy's encode.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json application/wasm;

    # React Router client-side routing: unknown paths fall back to
    # index.html instead of 404ing on refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every file name under /assets/, so a file there never changes: browsers may keep it
    # a year (Step 3). A location with its own add_header drops the server-level ones, so they are repeated here.
    # A missing asset is a plain 404, never index.html (an old tab asking for a chunk of a previous build must fail
    # cleanly instead of getting HTML as JavaScript).
    # ^~ keeps this prefix ahead of the picture rule below (a regex location would otherwise win for /assets/*.png).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # In-browser models (public/models/, e.g. the photo background remover, lib/backgroundRemoval.ts). Each file carries
    # a version in its name and is never changed in place (a new model gets a new name), so browsers may keep it a year.
    location ^~ /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Pictures from public/ (homepage, templates, icons) have no hash in their names, so a changed picture would keep its
    # old copy in browsers for days (nginx sent no Cache-Control and browsers guessed). "no-cache" makes the browser ask
    # each time; an unchanged file costs only a 304. A picture that isn't there is a 404, never the dashboard's HTML.
    # The homepage pictures were moved to /site/ on 2026-10-20 after third-party logos were removed from them.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|avif)$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # The app shell: always checked fresh, so a new build reaches every tab on its next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # The POS offline shell's service worker (POS-system-plan.md Step 13): always
    # checked fresh, so a new build reaches the counters; never the SPA fallback.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # The web app manifest (install to Home Screen): nginx's stock mime list has no entry for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The push-notification service worker (lib/pushNotifications.ts): same rule, checked fresh each time.
    location = /push-sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }
}
