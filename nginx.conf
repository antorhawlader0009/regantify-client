server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: unknown paths fall back to
    # index.html instead of 404ing on refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The POS offline shell's service worker (POS-system-plan.md Step 13): always
    # checked fresh, so a new build reaches the counters; never the SPA fallback.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
