server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard and the Super Admin panel must never be shown inside another site's frame (clickjacking): a store
    # page on a {sub}.ROOT_DOMAIN address is the same "site", so a framed dashboard would load signed in. Only our own
    # pages may frame it (printElement prints through a same-origin iframe). These apply to every location below that
    # has no add_header of its own (location / included).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Standard safety headers (security F-56). HSTS only matters over https (Caddy); browsers ignore it on plain http.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    server_tokens off;

    # React Router client-side routing: unknown paths fall back to
    # index.html instead of 404ing on refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The POS offline shell's service worker (POS-system-plan.md Step 13): always
    # checked fresh, so a new build reaches the counters; never the SPA fallback.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The web app manifest (install to Home Screen): nginx's stock mime list has no entry for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The push-notification service worker (lib/pushNotifications.ts): same rule, checked fresh each time.
    location = /push-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
